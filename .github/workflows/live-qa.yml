name: FileBrik Live QA

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Live production URL to test'
        required: true
        default: 'https://filebrik.pages.dev'

jobs:
  live-e2e-and-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Playwright e2e suite against live site
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npx playwright test --project="Mobile Chrome" --project="Desktop Chrome"
      - name: Install Lighthouse CLI
        run: npm install -g lighthouse@12.2.1
      - name: Run Lighthouse audit against live URLs
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          FAILED=0
          for route in "/" "/tools/compress-pdf/" "/tools/exam-photo-signature-resizer/"; do
            echo "Auditing live mobile performance for ${BASE_URL}${route}..."
            curl -fsS "${BASE_URL}${route}" > /dev/null || true
            PASS="0"
            METRICS="{}"
            for attempt in 1 2; do
              lighthouse "${BASE_URL}${route}" \
                --output=json \
                --output-path=./lh-live.json \
                --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
                --only-categories=performance,accessibility,best-practices,seo
              METRICS=$(node -e "const r=require('./lh-live.json'); const c=r.categories; const s=k=>Math.round((c[k]?.score||0)*100); const cls=(r.audits['cumulative-layout-shift']?.numericValue||0).toFixed(3); console.log(JSON.stringify({perf:s('performance'),a11y:s('accessibility'),bp:s('best-practices'),seo:s('seo'),cls:Number(cls),fcp:r.audits['first-contentful-paint']?.displayValue,lcp:r.audits['largest-contentful-paint']?.displayValue}));")
              echo "Live Lighthouse for ${route} (attempt ${attempt}): ${METRICS}"
              PASS=$(node -e "const m=${METRICS}; console.log(m.perf>=90 && m.a11y>=90 && m.bp>=90 && m.seo>=90 && m.cls<=0.05 ? '1' : '0');")
              if [ "$PASS" = "1" ]; then break; fi
            done
            if [ "$PASS" != "1" ]; then
              echo "::error::Live Lighthouse failed thresholds for ${route}: ${METRICS}"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-playwright-report
          path: test-results/
