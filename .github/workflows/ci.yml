name: FileBrik CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit & site tests
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: filebrik-dist
          path: dist/

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Playwright e2e suite
        run: npx playwright test --project="Mobile Chrome" --project="Desktop Chrome"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/

  lighthouse:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Install Lighthouse CLI
        run: npm install -g lighthouse
      - name: Run Lighthouse mobile performance check (>= 90, ads off)
        run: |
          npm run preview -- --port 4321 &
          SERVER_PID=$!
          for i in $(seq 1 25); do
            if curl -s -o /dev/null http://localhost:4321; then break; fi
            sleep 1
          done
          for route in "/" "/tools/compress-pdf/" "/tools/exam-photo-signature-resizer/"; do
            echo "Auditing mobile performance for $route..."
            lighthouse "http://localhost:4321${route}" \
              --output=json \
              --output-path=./lh-report.json \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance
            SCORE=$(node -e "const r=require('./lh-report.json'); console.log(Math.round((r.categories.performance.score || 0)*100));")
            echo "Mobile Performance score for ${route}: ${SCORE}"
            if [ "$SCORE" -lt 90 ]; then
              echo "::error::Mobile performance for ${route} is ${SCORE} (< 90)"
              kill $SERVER_PID || true
              exit 1
            fi
          done
          kill $SERVER_PID || true
